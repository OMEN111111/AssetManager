<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AssetManager · three.js 技术验证</title>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<style>
  html,body{margin:0;height:100%;background:#14161b;color:#e6e8ec;overflow:hidden;
    font:13px/1.55 "Segoe UI Variable","Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{display:grid;grid-template-columns:1fr 430px;height:100%}
  #stage{position:relative;min-width:0}
  #stage canvas{display:block;width:100%;height:100%}
  #label{position:absolute;left:18px;top:16px;font-size:12px;color:#9aa1ac;letter-spacing:.04em}
  #label b{display:block;font-size:15px;color:#e8eaed;letter-spacing:0;margin-bottom:2px}
  #panel{border-left:1px solid #2a2e36;background:#171a20;padding:18px;overflow:auto}
  h1{font-size:13px;font-weight:650;letter-spacing:.04em;margin:0 0 4px}
  .sub{font-size:11px;color:#6b7280;margin-bottom:14px}
  pre{margin:0;font:11.5px/1.6 ui-monospace,Consolas,monospace;color:#9fe3b0;white-space:pre-wrap}
  .row{display:flex;justify-content:space-between;border-bottom:1px solid #22262e;padding:5px 0;font-size:12px;color:#b7bec9}
</style>
</head>
<body>
<div class="wrap">
  <div id="stage"><canvas id="view"></canvas>
    <div id="label"><b>Gate_001 · ARM 打包贴图</b>左：Bamboo_4k 材质球（置换开启） · 右：FBX 模型</div>
  </div>
  <div id="panel">
    <h1>three.js 技术验证</h1>
    <div class="sub">真实素材 · 未做任何预处理</div>
    <pre id="metrics">running…</pre>
  </div>
</div>
<script>window.onerror=(m,s,l)=>{document.getElementById('metrics').textContent='ERROR: '+m+' @'+l;document.title='FAILED';};</script>
<script type="module" src="./test.js"></script>
</body>
</html>
